name: CI

# Every push: lint, typecheck and Vitest (fast).
# Pull requests to main (opened, ready for review, reopened) and manual runs: the same, plus
# `npm run build` and the full Playwright suite in three parallel jobs (admin, forms, chromium).
# Nothing here needs a secret: every value below is a throw-away test value, and each job has its own
# disposable MongoDB container.
on:
  push:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Test-only values (the app's getEnv() requires these to start).
  MONGODB_URI: mongodb://localhost:27017
  MONGODB_DB_NAME: dar_e_arqam_test
  BETTER_AUTH_URL: http://localhost:3100
  CLOUDINARY_CLOUD_NAME: ci-test-cloud
  CLOUDINARY_API_KEY: "000000000000000"
  CLOUDINARY_API_SECRET: ci-test-secret-not-real-000000
  NEWS_COVER_VERIFY: skip

jobs:
  checks:
    name: Lint, typecheck, Vitest${{ github.event_name != 'push' && ' and build' || '' }}
    # A draft pull request waits until it is marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        # mongo:8.0 (what Atlas runs) fails to start on runner kernels 6.19+: https://jira.mongodb.org/browse/SERVER-121912
        # Return to mongo:8.0 once that is fixed.
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run lint
      # PageProps, LayoutProps and RouteContext are generated by Next; a fresh checkout has none until this runs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # DB-backed tests run for real here (they skip silently without MONGODB_URI).
      - run: npx vitest run
      - name: Build
        if: github.event_name != 'push'
        run: npm run build
        env:
          # A production build refuses DOCUMENT_STORE_DRIVER=local and defaults to Vercel Blob, which wants a token. Not a real one.
          BLOB_READ_WRITE_TOKEN: ci-build-token-not-real

  playwright:
    name: Playwright (${{ matrix.project }})
    # Not on every push to a pull-request branch: only on open, ready for review, reopen and manual runs.
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Playwright only: these switch the app (and Vitest tests) into E2E-only code paths, so they must not leak
      # into the checks job.
      DOCUMENT_STORE_DRIVER: local
      DOCUMENT_STORE_LOCAL_DIR: .data/e2e-documents
      E2E_FRESH_READS: "1"
      NEXT_PUBLIC_NOTIFICATIONS_POLL_MS: "3000"
    strategy:
      fail-fast: false
      matrix:
        include:
          # admin and forms share one database and one rate-limit store, so they run with one worker.
          - { project: admin, workers: 1, timeout: 75 }
          - { project: forms, workers: 1, timeout: 40 }
          - { project: chromium, workers: 2, timeout: 60 }
    services:
      mongo:
        # mongo:8.0 (what Atlas runs) fails to start on runner kernels 6.19+: https://jira.mongodb.org/browse/SERVER-121912
        # Return to mongo:8.0 once that is fixed.
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # The production guards stay as they are, so the suite runs on the dev server (its test seams are
      # ignored in a production build). `npm run build` runs in the checks job above.
      - name: Start the dev server
        run: |
          nohup npm run dev -- --port 3100 > dev-server.log 2>&1 &
          echo "dev server started"
      - name: Warm every route
        run: node scripts/warm-routes.mjs http://localhost:3100
      - name: Playwright (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.workers }}
      - name: List flaky tests
        if: always()
        run: node scripts/ci-flaky-summary.mjs ${{ matrix.project }}
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            dev-server.log
          retention-days: 7
